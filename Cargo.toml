[package]
name = "rust-note"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
pulldown-cmark = { version = "0.12", default-features = false }
egui_commonmark = { version = "0.20", default-features = false }

[patch.crates-io]
egui_commonmark = { path = "vendor/egui_commonmark" }
